    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes flicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% {
                opacity: 1;
                text-shadow: 0 0 10px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.5);
            }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% {
                opacity: 0.4;
                text-shadow: none;
            }
        }

        @keyframes neonPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(0, 243, 255, 0.4), inset 0 0 5px rgba(0, 243, 255, 0.4); }
            50% { box-shadow: 0 0 20px rgba(0, 243, 255, 0.8), inset 0 0 10px rgba(0, 243, 255, 0.6); }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes reveal {
            from { clip-path: inset(0 100% 0 0); }
            to { clip-path: inset(0 0 0 0); }
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-inter { font-family: 'Inter', sans-serif; }
        
        .neon-text-cyan { color: #00f3ff; text-shadow: 0 0 10px rgba(0, 243, 255, 0.7); }
        .neon-text-pink { color: #ff00ff; text-shadow: 0 0 10px rgba(255, 0, 255, 0.7); }
        .neon-border-cyan { border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.5); }
        .neon-border-pink { border-color: #ff00ff; box-shadow: 0 0 15px rgba(255, 0, 255, 0.5); }
        
        .bg-cyber-black { background-color: #050505; }
        .bg-grid {
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .flicker { animation: flicker 3s infinite; }
        .neon-pulse { animation: neonPulse 2s infinite ease-in-out; }
        .glitch-hover:hover { animation: glitch 0.3s cubic-bezier(.25,.46,.45,.94) both infinite; }
        
        .glass-panel {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(0, 243, 255, 0.2);
            position: absolute;
            animation: scanline 4s linear infinite;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff00ff; }

        .reveal-anim { animation: reveal 1s ease-out forwards; }
    </style>
